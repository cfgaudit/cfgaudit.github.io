name: Site checks

# Checks the built site, not the generator (#29): accessibility with axe in
# light and dark mode, HTML with html-validate, CSS with stylelint. The SEO
# checks are Go tests (seo_test.go). Rules turned off, with the reason:
# html-validate no-trailing-whitespace (template output), doctype-style
# (<!doctype html> is valid), long-title (rule page titles come from the rule
# docs), no-inline-style (the --i animation index and the progress bar width,
# which the CSP allows on purpose); stylelint no-descending-specificity (the
# hits compare the scoped .top nav links with unrelated links elsewhere, which
# TestStyle_NavRulesScopedToHeader keeps apart).

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Accessibility, HTML and CSS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install the checkers
        working-directory: .github/site-checks
        run: |
          npm ci --ignore-scripts
          npm audit signatures
      - name: Build the site from the latest cfgaudit release
        run: ./scripts/build.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: HTML
        run: .github/site-checks/node_modules/.bin/html-validate --config .github/site-checks/htmlvalidate.json "_site/**/*.html"
      - name: CSS
        run: .github/site-checks/node_modules/.bin/stylelint --config .github/site-checks/stylelint.json static/style.css
      # The runner's Chrome; puppeteer-core downloads no browser.
      - name: Accessibility
        run: |
          # Compressed like GitHub Pages serves it (#34).
          python3 -I .github/site-checks/serve.py _site 8000 &
          CHROME_PATH=$(command -v google-chrome) node .github/site-checks/axe.mjs http://localhost:8000 .github/site-checks/pages.txt
